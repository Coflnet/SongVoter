services:
  songvoter:
    build: .
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      DB_CONNECTION: Host=db;Database=songvoter;Username=songvoter;Password=songvoter
      jwt__secret: ${SONGVOTER_JWT_SECRET:?Set SONGVOTER_JWT_SECRET to a random 32-byte or longer secret}
      hashids__salt: ${SONGVOTER_ID_SALT:?Set SONGVOTER_ID_SALT}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: songvoter
      POSTGRES_PASSWORD: songvoter
      POSTGRES_DB: songvoter
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U songvoter"]
      interval: 3s
      retries: 20
volumes:
  postgres:
